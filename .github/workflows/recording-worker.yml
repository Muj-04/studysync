name: Recording recovery worker
# One bounded pass of scripts/run-recording-worker.cjs per environment.
# It retries publication and cleanup of tracked recordings (#41). Interrupted work is
# reclaimed after lease expiry, so the GitHub schedule's 5-minute floor and delays only
# slow recovery; they cannot lose audio.
#
# Setup (repository Settings → Environments):
#   staging:    secrets SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY; variable EXPECTED_SUPABASE_REF=xokiiepdpjvqnpzwmbtb
#   production: same names with production values, EXPECTED_SUPABASE_REF=mlyvadsznvyurjakovau
# Production also needs repository variable RECORDING_WORKER_PRODUCTION_ENABLED=true,
# which is set only after the production recording migrations are applied.
# An environment without secrets is skipped, never failed.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        type: choice
        options: [staging, production]
        default: staging
permissions:
  contents: read
jobs:
  pass:
    strategy:
      fail-fast: false
      matrix:
        environment: ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.environment)) || fromJSON('["staging","production"]') }}
    if: >-
      github.repository == 'Muj-04/studysync'
    runs-on: ubuntu-latest
    environment: ${{ matrix.environment }}
    timeout-minutes: 3
    concurrency:
      group: recording-worker-${{ matrix.environment }}
      cancel-in-progress: false
    steps:
      - name: Check configuration
        id: gate
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          HAS_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY != '' }}
          EXPECTED_REF: ${{ vars.EXPECTED_SUPABASE_REF }}
          TARGET: ${{ matrix.environment }}
          PROD_ENABLED: ${{ vars.RECORDING_WORKER_PRODUCTION_ENABLED }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ "$HAS_KEY" != "true" ] || [ -z "$EXPECTED_REF" ]; then
            echo "Worker not configured for $TARGET; skipping."; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$TARGET" = "production" ] && [ "$PROD_ENABLED" != "true" ]; then
            echo "Production worker not enabled; skipping."; echo "run=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          host=$(node -e 'console.log(new URL(process.argv[1]).hostname)' "$SUPABASE_URL")
          if [ "$host" != "$EXPECTED_REF.supabase.co" ]; then
            echo "::error::SUPABASE_URL host does not match EXPECTED_SUPABASE_REF for $TARGET"; exit 1
          fi
          echo "run=true" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm
      # The CLI loads typescript at runtime, so dev dependencies are required.
      - run: npm ci --include=dev --ignore-scripts
        if: steps.gate.outputs.run == 'true'
      - name: Run one bounded pass
        if: steps.gate.outputs.run == 'true'
        timeout-minutes: 2
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/run-recording-worker.cjs --run --limit=20
